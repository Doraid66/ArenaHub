# Alembic configuration for ArenaHub.
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL
# from the environment (or .env), so no credentials end up in Git.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Migration files are named "<revision id>_<message>.py", e.g. 0001_create_facilities_and_fields.py.
# Always create them with a fixed id, in order:
#   alembic revision -m "create facilities and fields" --rev-id 0001
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S