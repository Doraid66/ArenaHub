# Start everything with:  docker compose up --build
# Values like ${POSTGRES_PASSWORD} come from your local .env file (see .env.example).

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arenahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
      POSTGRES_DB: ${POSTGRES_DB:-arenahub}
    volumes:
      - pgdata:/var/lib/postgresql/data   # keeps the data when containers restart
    ports:
      - "${POSTGRES_PORT:-5432}:5432"      # optional: lets you inspect the database from your Mac
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file: .env
    environment:
      # Inside Docker the database host is "db" (the service name), not localhost.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-arenahub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-arenahub}
    depends_on:
      db:
        condition: service_healthy        # wait until PostgreSQL accepts connections
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata: